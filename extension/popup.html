<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Board2TeX</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      width: 320px;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: #090d16;
      color: #f1f5f9;
      padding: 16px;
      border: 1px solid #1e293b;
    }
    .header {
      display: flex;
      align-items: center;
      gap: 10px;
      margin-bottom: 14px;
      padding-bottom: 12px;
      border-bottom: 1px solid #1e293b;
    }
    .logo {
      width: 32px;
      height: 32px;
      background: linear-gradient(135deg, #0ea5e9, #38bdf8);
      border-radius: 8px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 16px;
      font-weight: bold;
    }
    .title-box h1 { font-size: 15px; font-weight: 700; color: #fff; }
    .title-box p { font-size: 11px; color: #94a3b8; }
    .status-card {
      background: #0f172a;
      border: 1px solid #1e293b;
      border-radius: 10px;
      padding: 10px;
      margin-bottom: 14px;
      font-size: 11px;
      display: flex;
      flex-direction: column;
      gap: 6px;
    }
    .status-row { display: flex; align-items: center; justify-content: space-between; }
    .badge {
      display: inline-flex;
      align-items: center;
      gap: 4px;
      padding: 2px 7px;
      border-radius: 12px;
      font-size: 10px;
      font-weight: 600;
    }
    .badge-ok { background: rgba(34, 197, 94, 0.15); color: #4ade80; border: 1px solid rgba(34, 197, 94, 0.3); }
    .badge-warn { background: rgba(234, 179, 8, 0.15); color: #facc15; border: 1px solid rgba(234, 179, 8, 0.3); }
    .btn {
      width: 100%;
      padding: 10px 14px;
      border-radius: 8px;
      border: none;
      font-size: 12px;
      font-weight: 600;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      transition: all 0.2s ease;
      margin-bottom: 8px;
    }
    .btn-primary {
      background: linear-gradient(135deg, #0ea5e9, #2563eb);
      color: white;
      box-shadow: 0 4px 12px rgba(14, 165, 233, 0.25);
    }
    .btn-primary:hover { opacity: 0.95; transform: translateY(-1px); }
    .btn-secondary {
      background: #1e293b;
      color: #e2e8f0;
      border: 1px solid #334155;
    }
    .btn-secondary:hover { background: #334155; }
    .hotkey-hint {
      text-align: center;
      font-size: 10px;
      color: #64748b;
      margin-top: 6px;
    }
    kbd {
      background: #1e293b;
      padding: 2px 5px;
      border-radius: 4px;
      border: 1px solid #334155;
      font-family: monospace;
      color: #94a3b8;
    }
    .loader {
      display: none;
      text-align: center;
      padding: 10px;
      font-size: 12px;
      color: #38bdf8;
    }
  </style>
</head>
<body>
  <div class="header">
    <div class="logo">📐</div>
    <div class="title-box">
      <h1>Board2TeX</h1>
      <p>1-Click Overleaf Assistant</p>
    </div>
  </div>

  <div class="status-card">
    <div class="status-row">
      <span style="color:#94a3b8;">Overleaf Tab:</span>
      <span id="overleaf-badge" class="badge badge-warn">Searching...</span>
    </div>
    <div class="status-row">
      <span style="color:#94a3b8;">Vision Engine:</span>
      <span id="backend-badge" class="badge badge-ok">127.0.0.1:8008</span>
    </div>
  </div>

  <button id="btn-snip" class="btn btn-primary">
    <span>✂️</span> Snip Area on Screen
  </button>

  <button id="btn-sample" class="btn btn-secondary">
    <span>⚡</span> Inject Demo Sample to Overleaf
  </button>

  <input type="file" id="file-input" accept="image/*" style="display:none;">
  <button id="btn-upload" class="btn btn-secondary">
    <span>📁</span> Upload Photo & Inject
  </button>

  <div id="loader" class="loader">
    <span>⏳ Compiling LaTeX & TikZ...</span>
  </div>

  <div class="hotkey-hint">
    Shortcut: <kbd>Cmd+Shift+X</kbd> to snip anywhere
  </div>

  <script src="popup.js"></script>
</body>
</html>
